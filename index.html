<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riya Nambi — Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Colors: change these to restyle the whole site */
:root{
  --cream:#F7F4EC; --ink:#292638; --ink2:#4a4660;
  --lav:#AC9BE8; --lav-soft:#ECE6FA;
  --cobalt:#3659C9;
  --apricot:#FF9877; --apri-soft:#FDE7DD;
  --line:#E4DED0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
[id]{scroll-margin-top:90px}
body{background:var(--cream);color:var(--ink);font-family:"Inter",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}

/* nav */
nav{position:sticky;top:0;z-index:20;background:rgba(247,244,236,.88);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
nav.scrolled{border-color:var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:72px}
nav .brand{font-weight:700;font-size:1.45rem;text-decoration:none;letter-spacing:-.01em}
nav .links{display:flex;gap:6px;font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;color:var(--cobalt);font-weight:500}
nav .links a{text-decoration:none;padding:6px 4px}
nav .links a:hover{text-decoration:underline;text-underline-offset:4px}
nav .links span{opacity:.6;padding:6px 0}

/* hero */
.hero{margin:18px 0 64px;background:var(--lav);border-radius:24px;padding:clamp(36px,6vw,72px) clamp(28px,5vw,64px);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.18)}
.hero::before{content:"";position:absolute;right:120px;bottom:-120px;width:240px;height:240px;border-radius:50%;background:rgba(255,152,119,.35)}
.hero .hello{font-size:1rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:18px;position:relative;z-index:1}
.hero h1{font-size:clamp(2.6rem,6.5vw,5.2rem);line-height:1.02;letter-spacing:-.035em;font-weight:800;position:relative;z-index:1}
.hero h1 .blue{display:block;color:var(--cobalt)}
.hero p{font-size:clamp(1.15rem,2vw,1.4rem);max-width:760px;margin:24px 0 32px;position:relative;z-index:1}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--cobalt);color:#fff;text-decoration:none;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:1rem;padding:15px 24px;border-radius:12px;position:relative;z-index:1;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px -10px rgba(54,89,201,.7)}

/* section heads */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 28px}
.sec-head h2{font-size:clamp(1.8rem,3.4vw,2.4rem);font-weight:700;letter-spacing:-.02em}
.sec-head .yrs{color:var(--cobalt);font-size:1.2rem;font-weight:500}

/* year header */
.year{margin:72px 0 28px;display:grid;grid-template-columns:auto 1fr;gap:28px 48px;align-items:end}
.year .season{color:var(--cobalt);font-weight:600;letter-spacing:.1em;font-size:1rem;text-transform:uppercase}
.year h3{font-size:clamp(2.8rem,7vw,5rem);line-height:.95;font-weight:900;letter-spacing:-.04em}
.year .why{background:#fff;border:1.5px solid var(--line);border-left:6px solid var(--apricot);border-radius:16px;padding:20px 24px;font-size:clamp(1.12rem,1.8vw,1.3rem)}
.year .why b{display:block;color:var(--cobalt);font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}

/* project card */
.card{border-radius:24px;padding:18px;display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,4vw,48px);align-items:center;margin-bottom:28px}
.card.lav{background:var(--lav-soft)} .card.apri{background:var(--apri-soft)}
.card.flip .media{order:2}
.media{position:relative;border-radius:16px;overflow:hidden;background:#fff;aspect-ratio:4/3;box-shadow:0 1px 0 rgba(41,38,56,.06),0 18px 40px -24px rgba(41,38,56,.35)}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.media .swap{animation:swapin .45s ease}
@keyframes swapin{from{opacity:0}to{opacity:1}}
.cap{position:absolute;left:14px;top:14px;z-index:3;background:var(--ink);color:#fff;font-size:1.1rem;font-weight:500;padding:8px 14px;border-radius:10px;max-width:calc(100% - 28px)}
.cap:empty{display:none}
.thumbs{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:3;background:rgba(41,38,56,.75);padding:7px 11px;border-radius:999px}
.thumbs button{width:11px;height:11px;border-radius:50%;border:none;background:rgba(255,255,255,.5);cursor:pointer;transition:.2s}
.thumbs button.on{background:#fff;width:26px;border-radius:6px}
.body{padding:10px 14px 10px 0}
.card.flip .body{padding:10px 0 10px 14px}
.label{color:var(--cobalt);font-size:1rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.status{display:inline-block;margin-left:10px;background:var(--apricot);color:var(--ink);font-size:.8rem;font-weight:700;letter-spacing:.08em;padding:4px 10px;border-radius:999px;vertical-align:2px}
.card h4{font-size:clamp(2rem,4vw,3rem);line-height:1.02;font-weight:800;letter-spacing:-.03em;margin:10px 0 8px}
.oneliner{font-size:clamp(1.15rem,1.8vw,1.35rem);color:var(--ink2);margin-bottom:22px}
.rows{display:flex;flex-direction:column;gap:18px}
.row{font-size:clamp(1.1rem,1.6vw,1.25rem);padding-left:16px;border-left:3px solid var(--lav)}
.card.apri .row{border-left-color:var(--apricot)}
.row b{display:block;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:var(--cobalt);margin-bottom:3px}

/* about + contact */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:80px 0 40px}
.box{border-radius:24px;padding:clamp(28px,4vw,44px)}
.box h2{font-size:clamp(1.8rem,3.4vw,2.4rem);font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
.box p,.box li{font-size:1.2rem}
.box ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.box li::before{content:"→ ";color:var(--cobalt);font-weight:700}
.about{background:#fff;border:1.5px solid var(--line)}
.contact{background:var(--cobalt);color:#fff}
.contact a.mail{display:inline-block;margin-top:18px;background:#fff;color:var(--cobalt);font-weight:700;text-decoration:none;padding:14px 22px;border-radius:12px;font-size:1.15rem}
footer{text-align:center;color:var(--ink2);padding:30px 0 50px;font-size:.95rem}

/* reveal */
.rv{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}.media .swap{animation:none}}

@media (max-width:860px){
  .wrap{padding:0 16px}
  nav .links{font-size:.8rem}
  .card{grid-template-columns:1fr;padding:12px}
  .card.flip .media{order:0}
  .body,.card.flip .body{padding:6px 8px 14px}
  .year{grid-template-columns:1fr;gap:14px}
  .duo{grid-template-columns:1fr}
  .cap{font-size:.95rem}
}
</style>
</head>
<body>
<nav id="nav"><div class="wrap">
  <a class="brand" href="#top" id="brand"></a>
  <div class="links"><a href="#work">Work</a><span>/</span><a href="#about">About</a><span>/</span><a href="#contact">Contact</a></div>
</div></nav>
<main class="wrap" id="app"></main>

<script>
/* =========================================================
   EDIT YOUR STUFF HERE
   ========================================================= */
const PROFILE = {
  first: "Riya",                 // big top line of the name
  last:  "Nambi",                 // second line (gets the gradient)
  tagline: "A collection of robots, prototypes, questionable first attempts, and everything I've learned along the way.",
  email: "riyastar213@gmail.com",
  github: "",                    // optional, e.g. "https://github.com/you"
};

/* =========================================================
   2) YOUR PROJECTS
   - media: a file path, or { src, cap } to add a caption.
     Several items = a slideshow that advances on its own.
   - rows: [label, text]. Anything in [square brackets] shows
     up highlighted so you can spot what still needs filling in.
   ========================================================= */
/* =========================================================
   3) WHY, FOR EACH YEAR (shows as a big banner before that year)
   ========================================================= */
const YEARS = {
  "Freshman year":  { season: "2023–24", why: "I started learning CAD at the end of freshman year. This was the very first thing I made." },
  "Sophomore year": { season: "2024–25", why: "We were a brand new team of three with no robot. I wanted to learn how to turn an idea into something real, so I took on all of the CAD." },
  "Junior year":    { season: "2025–26", why: "After a rushed design cost us a whole season, I wanted to own one mechanism and actually iterate on it the right way. So I took the shooter." },
  "Senior year":    { season: "2026–27", why: "I built the shooter last year, so I know how it works and what to fix. This year I'm designing the chassis and the turret around it." },
};

const PROJECTS = [
  {
    title: "My First Part",
    year: "Freshman year",
    oneliner: "The first thing I ever made in CAD.",
    media: [{ src: "servo-mount.jpg", cap: "servo mount · v1 and only" }],
    rows: [
      ["What it is", "A plate that holds a servo and mounts it to the robot."],
      ["Why it's here", "It was the first thing I ever CADed, and somehow the one part I never had to redo."],
    ],
    tools: ["Fusion 360", "Servo"],
    links: [],
  },
  {
    title: "The Sketch",
    year: "Sophomore year",
    oneliner: "Sophomore year. Just me and two people who became my friends.",
    media: [{ src: "sketch.jpg", cap: "where it all started" }],
    rows: [
      ["Where we started", "Brand new team of three going into FTC Into the Deep (2024–25). No robot, no plan, nothing."],
      ["The plan", "We drew this out together: mecanum drive, a lift, an arm to score, and a hang that we honestly weren't sure about (hence the question mark)."],
      ["My part", "I took the sketch and turned it into a real robot in CAD."],
    ],
    tools: ["Team of 3", "Concept design"],
    links: [],
  },
  {
    title: "CADing the Robot",
    year: "Sophomore year",
    oneliner: "I did all of our CAD, from an empty frame to the whole robot.",
    media: [
      { src: "cad-early-frame.jpg", cap: "early · just the drivetrain + lift motors" },
      { src: "cad-v23-frame.jpg", cap: "v23 · frame + lift towers" },
      { src: "cad-v25-iso.jpg",   cap: "v25 · arm and intake added" },
      { src: "cad-v26-side.jpg",  cap: "v26 · side view" },
      { src: "cad-v27-rear.jpg",  cap: "v27 · from the back" },
      { src: "robot-photo.jpg",   cap: "and the real thing" },
    ],
    rows: [
      ["How it works", "The intake scoops a sample off the floor and pivots up to hand it to the claw. The claw sits on an arm that rides up the lift to score."],
      ["What I designed", "Basically everything: the mecanum drivetrain, a two-tower lift, an arm with a servo claw, and the intake up front."],
      ["Iteration", "It took 27+ versions to get here. The slideshow goes from the bare frame all the way to v27, then ends on the actual robot."],
    ],
    tools: ["Fusion 360", "goBILDA", "Mecanum drive", "Odometry"],
    links: [],
  },
  {
    title: "Designing the Intake",
    year: "Sophomore year",
    oneliner: "Three versions of the scoop, starting with my second CAD part ever.",
    media: [
      { src: "intake-v1-box.jpg",    cap: "v1 · just a box" },
      { src: "intake-v2-sample.jpg", cap: "v2 · shaped for the sample" },
      { src: "intake-v3-fillet.jpg", cap: "v3 · thin floor, back cut off" },
    ],
    rows: [
      ["v1", "Literally a box. It was the second thing I ever made in CAD."],
      ["v2", "Reshaped it to actually fit the Into the Deep sample."],
      ["v3", "Filleted the bottom so it was thin and way easier to get under pieces, but that thin floor kept breaking. I also cut off the back since we didn't need it, and it was blocking the claw from grabbing the sample during the transfer."],
    ],
    tools: ["Fusion 360", "3D printing", "Fillets", "Claw transfer"],
    links: [],
  },
  {
    title: "Slide Mounts",
    year: "Sophomore year",
    oneliner: "Small part, surprisingly annoying problem.",
    media: [
      { src: "mounts-lineup.jpg", cap: "v1 → v3 · the last one wraps over the top" },
    ],
    rows: [
      ["The problem", "These connected our Misumi slides to the goBILDA parts on the bot and to our outtake. The slides only had three screw holes total to secure them with."],
      ["Working around it", "We couldn't buy the flat head screws that actually fit Misumi slides, so we shaved down regular screws until they did."],
      ["The fix", "The mounts were plastic, so the weight of the slides made them bend a lot. The last version has a reinforcement that goes over the top to hold everything in place."],
    ],
    tools: ["Fusion 360", "3D printing", "Misumi slides", "goBILDA"],
    links: [],
  },
  {
    title: "The Coaxial Intake",
    year: "Sophomore year",
    oneliner: "The thing that cost us our season, and taught me the most.",
    media: [
      { src: "cad-intake-season.jpg", cap: "the original intake" },
    ],
    rows: [
      ["What I designed", "A coaxial intake. One axle ran through the pivot to lift it, and a belt ran through that same axle to power it, so it could swing up and down while still spinning."],
      ["What went wrong", "We put it together less than two weeks before competition, so there wasn't much time to fix anything. Once I got the gears meshing right, the software kept messing up. I hadn't added any physical stops, so it never stayed in the same spot and we kept losing our tuning. It ended up costing us the season."],
      ["The fix", "Over the summer I rebuilt it with hard stops, so it always lands in the same place and the code doesn't have to fight to hold it there. We're still using that version now, senior year."],
    ],
    tools: ["Fusion 360", "Belt drive", "Gear meshing", "Hard stops"],
    links: [],
  },
  {
    title: "The Shooter",
    year: "Junior year",
    oneliner: "New year, new robot. I designed the shooter.",
    media: [
      { src: "shooter-v1-flap.jpg",       cap: "v1 · huge, with a flap" },
      { src: "shooter-v2-big-hood.jpg",   cap: "v2 · even bigger, now with a hood" },
      { src: "shooter-v3-small-hood.jpg", cap: "v3 · smaller, kept the hood" },
    ],
    rows: [
      ["3 big versions", "Started with a huge shooter with a flap. Then went even bigger and added a hood. Then made it smaller but kept the hood."],
      ["7 small ones", "On top of that, there were 7 more iterations just tweaking the flywheel size and the compression on the game piece."],
      ["Where it landed", "7.6 mm of compression, a 6000 RPM motor, and 3-inch durometer wheels."],
    ],
    tools: ["Fusion 360", "Flywheel", "7.6 mm compression", "6000 RPM"],
    links: [],
  },
  {
    title: "Chassis + Turret",
    year: "Senior year",
    status: "In progress",
    oneliner: "Building the base and a turret for this year's shooter.",
    media: [
      { src: "senior-turret.jpg",  cap: "turret · ring gear driven by a servo" },
      { src: "senior-chassis.jpg", cap: "chassis · in progress" },
    ],
    rows: [
      ["What I'm building", "The chassis, plus a turret so the shooter can aim without turning the whole robot. A big ring gear on the plate, driven by a small gear on a servo."],
      ["Using last year", "Since I made the shooter last year, I already know how it works and how to make it better this time."],
      ["Right now", "Still in progress. I'm working on it alongside college apps (and this portfolio)."],
    ],
    tools: ["Fusion 360", "Ring gear", "Servo", "Mecanum drive"],
    links: [],
  },
];


/* ======== nothing below needs editing ======== */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const pad = n => String(n).padStart(2,"0");
const srcOf = m => typeof m==="string" ? m : m.src;
const capOf = m => typeof m==="string" ? "" : (m.cap||"");
const img = m => `<img src="${esc(srcOf(m))}" alt="${esc(capOf(m))}" loading="lazy">`;
const name = `${PROFILE.first} ${PROFILE.last}`;
document.getElementById("brand").textContent = name.toLowerCase();

let html = `
<section class="hero" id="top">
  <div class="hello">Hello! I'm ${esc(PROFILE.first)} —</div>
  <h1>I like figuring out how things work.<span class="blue">And making them better.</span></h1>
  <p>${esc(PROFILE.tagline)}</p>
  <a class="btn" href="#work">See what I've built ↗</a>
</section>
<section id="work">
  <div class="sec-head rv"><h2>Selected projects</h2><span class="yrs">2023–2027</span></div>`;
let k=0;
PROJECTS.forEach((p,i)=>{
  if(p.year && (i===0 || PROJECTS[i-1].year!==p.year)){
    const Y=YEARS[p.year]||{};
    html += `<div class="year rv"><div><div class="season">${esc(Y.season||"")}</div><h3>${esc(p.year)}</h3></div>
      ${Y.why?`<div class="why"><b>Why</b>${esc(Y.why)}</div>`:""}</div>`;
  }
  const tint = k%2 ? "apri" : "lav", flip = k%2===1; k++;
  html += `
  <article class="card ${tint}${flip?" flip":""} rv" id="p${i+1}">
    <div class="media" data-i="${i}">
      ${img(p.media[0])}
      <span class="cap">${esc(capOf(p.media[0]))}</span>
      ${p.media.length>1?`<div class="thumbs">${p.media.map((_,j)=>`<button aria-label="picture ${j+1}" class="${j?"":"on"}"></button>`).join("")}</div>`:""}
    </div>
    <div class="body">
      <div class="label">${pad(i+1)} / ${esc(p.year||"")}${p.status?`<span class="status">${esc(p.status)}</span>`:""}</div>
      <h4>${esc(p.title)}</h4>
      <div class="oneliner">${esc(p.oneliner)}</div>
      <div class="rows">${(p.rows||[]).map(([l,t])=>`<div class="row"><b>${esc(l)}</b>${esc(t)}</div>`).join("")}</div>
    </div>
  </article>`;
});
html += `</section>
<section class="duo">
  <div class="box about rv" id="about">
    <h2>About</h2>
    <ul>
      <li>Started CADing at the end of freshman year</li>
      <li>Real robot work started sophomore year, on a team of three</li>
      <li>I do our CAD in Fusion 360</li>
      <li>Senior year: chassis + turret</li>
    </ul>
  </div>
  <div class="box contact rv" id="contact">
    <h2>Say hi</h2>
    <p>Questions about any of these builds? I'm happy to talk about them.</p>
    <a class="mail" href="mailto:${esc(PROFILE.email)}">${esc(PROFILE.email)}</a>
  </div>
</section>
<footer>${esc(name)} · ${new Date().getFullYear()}</footer>`;
document.getElementById("app").innerHTML = html;

/* slideshow: auto-advance when on screen, pause on hover */
document.querySelectorAll(".media").forEach(m=>{
  const p=PROJECTS[m.dataset.i], btns=[...m.querySelectorAll(".thumbs button")];
  let cur=0, hover=false;
  const show=j=>{ cur=j; const t=document.createElement("div"); t.innerHTML=img(p.media[j]);
    const el=t.firstElementChild; el.classList.add("swap"); m.querySelector("img").replaceWith(el);
    m.querySelector(".cap").textContent=capOf(p.media[j]); btns.forEach((b,x)=>b.classList.toggle("on",x===j)); };
  btns.forEach((b,j)=>b.onclick=()=>show(j));
  if(btns.length) setInterval(()=>{ const r=m.getBoundingClientRect(); if(!hover && r.top<innerHeight && r.bottom>0) show((cur+1)%btns.length); },3000);
  m.addEventListener("mouseenter",()=>hover=true); m.addEventListener("mouseleave",()=>hover=false);
});
/* reveal on scroll */
const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} }),{threshold:.12});
document.querySelectorAll(".rv").forEach(el=>io.observe(el));
addEventListener("scroll",()=>document.getElementById("nav").classList.toggle("scrolled",scrollY>10),{passive:true});
</script>
</body>
</html>
