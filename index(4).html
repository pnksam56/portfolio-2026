<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riya Nambi — Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Colors: change these to restyle the whole site */
:root{
  --cream:#F7F4EC; --ink:#292638; --ink2:#4a4660;
  --lav:#AC9BE8; --lav-soft:#ECE6FA;
  --cobalt:#3659C9;
  --apricot:#FF9877; --apri-soft:#FDE7DD;
  --line:#E4DED0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
[id]{scroll-margin-top:90px}
body{background:var(--cream);color:var(--ink);font-family:"Inter",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}

/* nav */
nav{position:sticky;top:0;z-index:20;background:rgba(247,244,236,.88);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
nav.scrolled{border-color:var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:72px}
nav .brand{font-weight:600;font-size:1.2rem;text-decoration:none;letter-spacing:-.01em}
nav .links{display:flex;gap:6px;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--cobalt);font-weight:500}
nav .links a{text-decoration:none;padding:6px 4px}
nav .links a:hover{text-decoration:underline;text-underline-offset:4px}
nav .links span{opacity:.6;padding:6px 0}

/* hero */
.hero{margin:18px 0 64px;background:var(--lav);border-radius:24px;padding:clamp(36px,6vw,72px) clamp(28px,5vw,64px);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.18)}
.hero::before{content:"";position:absolute;right:120px;bottom:-120px;width:240px;height:240px;border-radius:50%;background:rgba(255,152,119,.35)}
.hero .hello{font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:18px;position:relative;z-index:1}
.hero h1{font-size:clamp(2rem,4.4vw,3.4rem);line-height:1.1;letter-spacing:-.025em;font-weight:700;position:relative;z-index:1}
.hero h1 .blue{display:block;color:var(--cobalt)}
.hero p{font-size:clamp(1.05rem,1.6vw,1.2rem);max-width:760px;margin:24px 0 32px;position:relative;z-index:1}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--cobalt);color:#fff;text-decoration:none;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.9rem;padding:13px 22px;border-radius:12px;position:relative;z-index:1;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px -10px rgba(54,89,201,.7)}

/* section heads */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 28px}
.sec-head h2{font-size:clamp(1.5rem,2.6vw,1.9rem);font-weight:600;letter-spacing:-.02em}
.sec-head .yrs{color:var(--cobalt);font-size:1.05rem;font-weight:500}

/* year header */
.year{margin:64px 0 24px;display:grid;grid-template-columns:auto 1fr;gap:28px 48px;align-items:end}
.year .season{color:var(--cobalt);font-weight:600;letter-spacing:.1em;font-size:.85rem;text-transform:uppercase}
.year h3{font-size:clamp(1.9rem,3.6vw,2.6rem);line-height:1.05;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.year .why{background:#fff;border:1px solid var(--line);border-left:4px solid var(--apricot);border-radius:14px;padding:18px 22px;font-size:clamp(1rem,1.4vw,1.1rem);line-height:1.65}
.year .why b{display:block;color:var(--cobalt);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}

/* project card */
.card{border-radius:24px;padding:18px;display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,4vw,48px);align-items:center;margin-bottom:28px}
.card.lav{background:var(--lav-soft)} .card.apri{background:var(--apri-soft)}
.card.flip .media{order:2}
.media{position:relative;border-radius:16px;overflow:hidden;background:#fff;aspect-ratio:4/3;box-shadow:0 1px 0 rgba(41,38,56,.06),0 18px 40px -24px rgba(41,38,56,.35)}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.media .swap{animation:swapin .45s ease}
@keyframes swapin{from{opacity:0}to{opacity:1}}
.cap{position:absolute;left:14px;top:14px;z-index:3;background:rgba(41,38,56,.88);color:#fff;font-size:.95rem;font-weight:500;padding:7px 12px;border-radius:10px;max-width:calc(100% - 28px)}
.cap:empty{display:none}
.thumbs{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:3;background:rgba(41,38,56,.75);padding:7px 11px;border-radius:999px}
.thumbs button{width:11px;height:11px;border-radius:50%;border:none;background:rgba(255,255,255,.5);cursor:pointer;transition:.2s}
.thumbs button.on{background:#fff;width:26px;border-radius:6px}
.body{padding:10px 14px 10px 0}
.card.flip .body{padding:10px 0 10px 14px}
.label{color:var(--cobalt);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.status{display:inline-block;margin-left:10px;background:var(--apricot);color:var(--ink);font-size:.8rem;font-weight:700;letter-spacing:.08em;padding:4px 10px;border-radius:999px;vertical-align:2px}
.card h4{font-size:clamp(1.5rem,2.4vw,1.9rem);line-height:1.15;font-weight:700;letter-spacing:-.015em;margin:8px 0 6px}
.oneliner{font-size:clamp(1rem,1.4vw,1.1rem);color:var(--ink2);margin-bottom:20px;line-height:1.6}
.rows{display:flex;flex-direction:column;gap:16px}
.row{font-size:clamp(.98rem,1.25vw,1.05rem);line-height:1.7;padding-left:16px;border-left:2px solid var(--lav)}
.card.apri .row{border-left-color:var(--apricot)}
.row b{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--cobalt);margin-bottom:3px}

/* click-through */
.media.multi img{cursor:pointer}
.nav-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(255,255,255,.92);color:var(--ink);font-size:1.3rem;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px -4px rgba(41,38,56,.35);transition:transform .15s,background .15s}
.nav-btn:hover{background:#fff;transform:translateY(-50%) scale(1.08)}
.nav-btn.prev{left:12px} .nav-btn.next{right:12px}
.count{position:absolute;right:14px;top:14px;z-index:3;background:rgba(41,38,56,.88);color:#fff;font-size:.85rem;padding:6px 10px;border-radius:999px}

/* about + contact */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:80px 0 40px}
.box{border-radius:24px;padding:clamp(28px,4vw,44px)}
.box h2{font-size:clamp(1.4rem,2.4vw,1.7rem);font-weight:700;letter-spacing:-.02em;margin-bottom:14px}
.box p,.box li{font-size:1.05rem;line-height:1.65}
.box ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.box li::before{content:"→ ";color:var(--cobalt);font-weight:700}
.about{background:#fff;border:1.5px solid var(--line)}
.contact{background:var(--cobalt);color:#fff}
.contact a.mail{display:inline-block;margin-top:18px;background:#fff;color:var(--cobalt);font-weight:600;text-decoration:none;padding:12px 20px;border-radius:12px;font-size:1rem}
footer{text-align:center;color:var(--ink2);padding:30px 0 50px;font-size:.95rem}

/* reveal */
.rv{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}.media .swap{animation:none}}

@media (max-width:860px){
  .wrap{padding:0 16px}
  nav .links{font-size:.8rem}
  .card{grid-template-columns:1fr;padding:12px}
  .card.flip .media{order:0}
  .body,.card.flip .body{padding:6px 8px 14px}
  .year{grid-template-columns:1fr;gap:14px}
  .duo{grid-template-columns:1fr}
  .cap{font-size:.95rem}
}
</style>
</head>
<body>
<nav id="nav"><div class="wrap">
  <a class="brand" href="#top" id="brand"></a>
  <div class="links"><a href="#work">Work</a><span>/</span><a href="#about">About</a><span>/</span><a href="#contact">Contact</a></div>
</div></nav>
<main class="wrap" id="app"></main>

<script>
/* =========================================================
   EDIT YOUR STUFF HERE
   ========================================================= */
const PROFILE = {
  first: "Riya",
  last:  "Nambi",
  tagline: "A collection of robots, prototypes, questionable first attempts, and everything I've learned along the way.",
  email: "riyastar213@gmail.com",
};

/* The "Why" for each year (shows above that year's projects) */
const YEARS = {
  "Freshman year":  { season: "Spring 2024", why: "I started learning CAD toward the end of freshman year, mostly by opening Fusion 360 and figuring things out as I went, and this was the very first thing I made." },
  "Sophomore year": { season: "2024–25", why: "We were a brand new team of three with no robot and honestly no real plan yet, so I took on all of the CAD because I wanted to learn how to take an idea from a sketch on paper all the way to something that actually works on the field." },
  "Junior year":    { season: "2025–26", why: "After a rushed design ended up costing us a whole season, I wanted to own one mechanism from start to finish and actually iterate on it the right way, so I took on the shooter." },
  "Senior year":    { season: "2026–27", why: "Since I designed the shooter last year, I already know how it works and where it can be better, so this year I'm designing the chassis and a turret around it." },
};

/* Projects. media: { src, cap }. rows: [label, text] */
const PROJECTS = [
  {
    title: "My First Part",
    year: "Freshman year",
    oneliner: "The very first thing I ever made in CAD, and somehow the one part I never had to redo.",
    media: [{ src: "servo-mount.jpg", cap: "servo mount · v1 and only" }],
    rows: [
      ["What it is", "It's a plate that holds a servo and mounts it onto the robot. It's a pretty simple part, but it was the first time I took something from an empty sketch to a real piece on our robot."],
      ["Why it's here", "It was the first thing I ever CADed, and it's kind of funny looking back that it's also the one part I never had to go back and redesign, especially compared to everything that comes after it."],
    ],
  },
  {
    title: "The Sketch",
    year: "Sophomore year",
    oneliner: "Sophomore year, when it was just me and two people who ended up becoming my friends.",
    media: [{ src: "sketch.jpg", cap: "where it all started" }],
    rows: [
      ["Where we started", "We were a brand new team going into FTC Into the Deep (2024–25), and we didn't have a robot, a design, or really any idea of what we were doing yet."],
      ["The plan", "We sat down and drew this out together: a mecanum drivetrain, a lift, an arm to score, and a hang mechanism that we honestly weren't sure about, which is why it has a question mark on it."],
      ["My part", "From there, I took the sketch and turned it into an actual robot in CAD, which is what the rest of this year is about."],
    ],
  },
  {
    title: "CADing the Robot",
    year: "Sophomore year",
    oneliner: "I did all of our CAD, starting from an empty frame and working up to the whole robot.",
    media: [
      { src: "cad-early-frame.jpg", cap: "early · just the drivetrain + lift motors" },
      { src: "cad-v23-frame.jpg",   cap: "v23 · frame + lift towers" },
      { src: "cad-v25-iso.jpg",     cap: "v25 · arm and intake added" },
      { src: "cad-v26-side.jpg",    cap: "v26 · side view" },
      { src: "cad-v27-rear.jpg",    cap: "v27 · from the back" },
      { src: "robot-soph-built.jpg", cap: "the real robot, built" },
      { src: "robot-photo.jpg",     cap: "close-up · odometry pod" },
    ],
    rows: [
      ["How it works", "The intake scoops a sample up off the floor and pivots up to hand it off to the claw, and the claw sits on an arm that rides up the lift so it can reach up and score."],
      ["What I designed", "Pretty much everything on it, including the mecanum drivetrain, the two-tower lift, the arm with a servo claw, and the intake in the front."],
      ["Iteration", "It took more than 27 versions to get here, so the pictures walk through it starting from the bare frame, then v23 through v27, and end on photos of the actual robot we built."],
    ],
  },
  {
    title: "Designing the Intake",
    year: "Sophomore year",
    oneliner: "Three versions of the scoop, starting with the second thing I ever made in CAD.",
    media: [
      { src: "intake-v1-box.jpg",    cap: "v1 · just a box" },
      { src: "intake-v2-sample.jpg", cap: "v2 · shaped for the sample" },
      { src: "intake-v3-fillet.jpg", cap: "v3 · thin floor, back cut off" },
    ],
    rows: [
      ["v1", "The first version was literally just a box, which makes sense since it was only the second thing I had ever made in CAD."],
      ["v2", "For the second version, I reshaped it so it was actually built around the Into the Deep sample."],
      ["v3", "For the third, I filleted the bottom so it was thin enough to slide under pieces, which made picking things up way easier, but that thin floor also kept breaking. I also cut off the back, since we didn't really need it and it was getting in the way of the claw grabbing the sample during the transfer."],
    ],
  },
  {
    title: "Slide Mounts",
    year: "Sophomore year",
    oneliner: "A small part that turned out to be a surprisingly annoying problem.",
    media: [{ src: "mounts-lineup.jpg", cap: "v1 → v3 · the last one wraps over the top" }],
    rows: [
      ["The problem", "These mounts connected our Misumi slides to the goBILDA parts on the robot and to our outtake, and the slides only had three screw holes total that we could use to hold everything on."],
      ["Working around it", "We couldn't buy the flat head screws that are actually made to fit Misumi slides, so we ended up shaving down regular screws until they fit."],
      ["The fix", "Since the mounts were plastic, the weight of the slides made them bend a lot, so in the last version I added a reinforcement that goes over the top to hold everything in place."],
    ],
  },
  {
    title: "The Coaxial Intake",
    year: "Sophomore year",
    oneliner: "The thing that ended up costing us our season, and also the thing that taught me the most.",
    media: [{ src: "cad-intake-season.jpg", cap: "the original intake" }],
    rows: [
      ["What I designed", "A coaxial intake, where one axle ran through the pivot to lift the intake and a belt ran through that same axle to power it, so it could swing up and down while still spinning."],
      ["What went wrong", "We put it together less than two weeks before competition, so there wasn't much time left to fix anything. Once I got the gears meshing properly, the software kept having problems, because I hadn't added any physical stops, so the intake never stayed in the same spot and we kept losing our tuning. In the end, it cost us the season."],
      ["The fix", "Over the summer, I rebuilt it with hard stops so it always lands in the same place and the code doesn't have to fight to hold it there, and we're still using that version now in my senior year."],
    ],
  },
  {
    title: "The Shooter",
    year: "Junior year",
    oneliner: "A new year and a new robot, and this time I designed the shooter.",
    media: [
      { src: "shooter-v1-flap.jpg",       cap: "v1 · huge, with a flap" },
      { src: "shooter-v2-big-hood.jpg",   cap: "v2 · even bigger, now with a hood" },
      { src: "shooter-v3-small-hood.jpg", cap: "v3 · smaller, kept the hood" },
      { src: "robot-junior-built.jpg",    cap: "the real robot, with my shooter on top" },
    ],
    rows: [
      ["3 big versions", "I started with a huge shooter that used a flap, then went even bigger and added a hood, and then made it smaller while keeping the hood."],
      ["7 small ones", "On top of those, there were 7 more iterations where I was just tweaking the size of the flywheel and how much compression it put on the game piece."],
      ["Where it landed", "It ended up at 7.6 mm of compression with a 6000 RPM motor and 3-inch durometer wheels, and the last picture shows it built and sitting on top of the real robot."],
    ],
  },
  {
    title: "Chassis + Turret",
    year: "Senior year",
    status: "In progress",
    oneliner: "Designing the base and a turret for this year's shooter, which is still in progress.",
    media: [
      { src: "senior-turret.jpg",  cap: "turret · ring gear driven by a servo" },
      { src: "senior-chassis.jpg", cap: "chassis · in progress" },
    ],
    rows: [
      ["What I'm building", "I'm designing the chassis, along with a turret so the shooter can aim without the whole robot having to turn. It uses a big ring gear on the plate that's driven by a smaller gear on a servo."],
      ["Using last year", "Since I made the shooter last year, I already know how it works and what I'd want to improve, so I'm designing everything around it this time."],
      ["Right now", "It's still in progress, and I'm working on it alongside college apps (and this portfolio)."],
    ],
  },
];

/* ======== nothing below needs editing ======== */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const pad = n => String(n).padStart(2,"0");
const srcOf = m => typeof m==="string" ? m : m.src;
const capOf = m => typeof m==="string" ? "" : (m.cap||"");
const img = m => `<img src="${esc(srcOf(m))}" alt="${esc(capOf(m))}" loading="lazy">`;
const name = `${PROFILE.first} ${PROFILE.last}`;
document.getElementById("brand").textContent = name.toLowerCase();

let html = `
<section class="hero" id="top">
  <div class="hello">Hello! I'm ${esc(PROFILE.first)} —</div>
  <h1>I like figuring out how things work.<span class="blue">And making them better.</span></h1>
  <p>${esc(PROFILE.tagline)}</p>
  <a class="btn" href="#work">See what I've built ↗</a>
</section>
<section id="work">
  <div class="sec-head rv"><h2>Selected projects</h2><span class="yrs">2024–2027</span></div>`;
let k=0;
PROJECTS.forEach((p,i)=>{
  if(p.year && (i===0 || PROJECTS[i-1].year!==p.year)){
    const Y=YEARS[p.year]||{};
    html += `<div class="year rv"><div><div class="season">${esc(Y.season||"")}</div><h3>${esc(p.year)}</h3></div>
      ${Y.why?`<div class="why"><b>Why</b>${esc(Y.why)}</div>`:""}</div>`;
  }
  const tint = k%2 ? "apri" : "lav", flip = k%2===1; k++;
  html += `
  <article class="card ${tint}${flip?" flip":""} rv" id="p${i+1}">
    <div class="media${p.media.length>1?" multi":""}" data-i="${i}" tabindex="${p.media.length>1?0:-1}">
      ${img(p.media[0])}
      <span class="cap">${esc(capOf(p.media[0]))}</span>
      ${p.media.length>1?`<button class="nav-btn prev" aria-label="previous picture">‹</button><button class="nav-btn next" aria-label="next picture">›</button><span class="count">1 / ${p.media.length}</span><div class="thumbs">${p.media.map((_,j)=>`<button aria-label="picture ${j+1}" class="${j?"":"on"}"></button>`).join("")}</div>`:""}
    </div>
    <div class="body">
      <div class="label">${pad(i+1)} / ${esc(p.year||"")}${p.status?`<span class="status">${esc(p.status)}</span>`:""}</div>
      <h4>${esc(p.title)}</h4>
      <div class="oneliner">${esc(p.oneliner)}</div>
      <div class="rows">${(p.rows||[]).map(([l,t])=>`<div class="row"><b>${esc(l)}</b>${esc(t)}</div>`).join("")}</div>
    </div>
  </article>`;
});
html += `</section>
<section class="duo">
  <div class="box about rv" id="about">
    <h2>About</h2>
    <ul>
      <li>I started CADing at the end of freshman year, and the real robot work started sophomore year on a team of three.</li>
      <li>I do our CAD in Fusion 360.</li>
      <li>This year I'm designing our chassis and turret.</li>
    </ul>
  </div>
  <div class="box contact rv" id="contact">
    <h2>Say hi</h2>
    <p>If you have any questions about these builds, I'd be really happy to talk about them.</p>
    <a class="mail" href="mailto:${esc(PROFILE.email)}">${esc(PROFILE.email)}</a>
  </div>
</section>
<footer>${esc(name)} · ${new Date().getFullYear()}</footer>`;
document.getElementById("app").innerHTML = html;

/* pictures: arrows, click, swipe, keyboard; auto-advance stops once you click */
document.querySelectorAll(".media").forEach(m=>{
  const p=PROJECTS[m.dataset.i], n=p.media.length, btns=[...m.querySelectorAll(".thumbs button")];
  if(n<2) return;
  let cur=0, hover=false, manual=false;
  const show=j=>{ cur=(j+n)%n; const t=document.createElement("div"); t.innerHTML=img(p.media[cur]);
    const el=t.firstElementChild; el.classList.add("swap"); m.querySelector("img").replaceWith(el);
    m.querySelector(".cap").textContent=capOf(p.media[cur]); m.querySelector(".count").textContent=`${cur+1} / ${n}`;
    btns.forEach((b,x)=>b.classList.toggle("on",x===cur)); };
  const go=(d,e)=>{ if(e) e.stopPropagation(); manual=true; show(cur+d); };
  m.querySelector(".prev").onclick=e=>go(-1,e);
  m.querySelector(".next").onclick=e=>go(1,e);
  btns.forEach((b,j)=>b.onclick=e=>{ e.stopPropagation(); manual=true; show(j); });
  m.addEventListener("click",e=>{ if(e.target.tagName==="IMG") go(1); });
  m.addEventListener("keydown",e=>{ if(e.key==="ArrowRight") go(1); if(e.key==="ArrowLeft") go(-1); });
  let sx=null; m.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
  m.addEventListener("touchend",e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40) go(dx<0?1:-1); sx=null; });
  setInterval(()=>{ const r=m.getBoundingClientRect(); if(!manual && !hover && r.top<innerHeight && r.bottom>0) show(cur+1); },3500);
  m.addEventListener("mouseenter",()=>hover=true); m.addEventListener("mouseleave",()=>hover=false);
});
/* reveal on scroll */
const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} }),{threshold:.12});
document.querySelectorAll(".rv").forEach(el=>io.observe(el));
addEventListener("scroll",()=>document.getElementById("nav").classList.toggle("scrolled",scrollY>10),{passive:true});
</script>
</body>
</html>
